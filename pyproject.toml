[project]
name = "apdm"
version = "0.1.0"
description = "DTU 02830 Advanced Project in Digital Media"
requires-python = ">=3.12"
dependencies = [
    "dspy==3.3.1",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
local = [
    "laya>=0.4.13",
]
embed = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
]
